<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>ORION</title>
  <meta name="description" content="Talk to ORION, your always-on local AI.">
  <meta name="theme-color" content="#0B0B0C">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="ORION">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&family=Oxanium:wght@400;500&display=swap">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="bg" aria-hidden="true"></div>

  <!-- The network: ORION, his tools, their skills and recent calls -->
  <div class="stage" id="stage">
    <canvas class="graph" id="graph" role="img" aria-label="ORION's network. ORION is in the middle; each tool is joined to him by a beam of light that brightens while he uses it."></canvas>
    <!-- Flow view: ORION, his work in groups, and what's in each group -->
    <div class="flow" id="flow" hidden>
      <svg class="flow-lines" id="flow-lines" aria-hidden="true"></svg>
      <div class="flow-orb" id="flow-orb">
        <div class="fo-title"><span>ORION</span><small id="fo-model">Qwen 3.5 9B</small></div>
        <canvas id="flow-canvas" aria-hidden="true"></canvas>
        <div class="fo-pills"><span class="mpill"><b>Queue</b><span id="fo-queue">0</span></span><span class="state-bar" id="fo-state"></span></div>
      </div>
      <div class="flow-chips" id="flow-chips" role="tablist" aria-label="Groups"></div>
      <div class="flow-items" id="flow-items"></div>
    </div>
    <!-- Phone: the network cut down to a core, a ring and its tools -->
    <div class="orbit" id="orbit"></div>
    <p class="m-state" id="m-state" aria-live="polite">Standing by</p>
    <button class="tile map-expand" id="btn-map" aria-label="Expand map" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h6v6M10 20H4v-6M20 4l-7 7M4 20l7-7"/></svg>
    </button>
  </div>

  <!-- Top bar -->
  <header class="topbar" id="topbar">
    <div class="tb-left">
      <button class="tile round" id="btn-menu" aria-label="Open dashboards" aria-haspopup="dialog" aria-controls="drawer">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8h14M5 12h14M5 16h9"/></svg>
      </button>
      <button class="brand" id="brand" aria-label="ORION, replay the intro"></button>
    </div>

    <div class="tb-right">
      <button class="pill-btn glass-pill" id="btn-new-task">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>New task</span>
      </button>
      <button class="tile round bell" id="btn-approvals" data-owner aria-label="Approvals" aria-haspopup="dialog" aria-expanded="false" aria-controls="approvals-pop">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 9.5a5.5 5.5 0 1 1 11 0c0 4 1.3 5.5 2 6.5h-15c.7-1 2-2.5 2-6.5Z"/><path d="M10 19a2 2 0 0 0 4 0"/></svg>
        <span class="tdot" id="approval-dot" hidden></span>
      </button>
      <span class="conn" id="conn" role="status" aria-label="Connecting">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path class="conn-arc" d="M12 4a8 8 0 0 1 0 16Z"/></svg>
      </span>
    </div>
  </header>

  <!-- Icon rail, left -->
  <nav class="rail" id="rail" aria-label="Pages and dashboards">
    <a class="rb on" href="#/" data-route="home" aria-label="ORION" data-tip="ORION">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="2.6"/><circle cx="5" cy="5" r="1.6"/><circle cx="19" cy="6" r="1.6"/><circle cx="5" cy="19" r="1.6"/><circle cx="19" cy="18" r="1.6"/><path d="M6.2 6.2 10 10M17.8 7.2 14 10.4M6.2 17.8 10 14M17.8 16.8 14 13.6"/></svg>
    </a>
    <a class="rb" href="#/chat" data-route="chat" aria-label="Conversation" data-tip="Conversation">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 6.5A2.5 2.5 0 0 1 7.5 4h9A2.5 2.5 0 0 1 19 6.5v7a2.5 2.5 0 0 1-2.5 2.5H11l-4 3.5V16h0.5"/><path d="M5 6.5V14a2 2 0 0 0 2 2"/></svg>
    </a>
    <a class="rb" href="#/business" data-route="business" data-owner aria-label="Business" data-tip="Business">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h16"/><path d="M7 16v-4M12 16V7M17 16v-6"/></svg>
    </a>
    <span class="rail-sep"></span>
    <button class="rb" data-open="activity" aria-label="Activity" data-tip="Activity">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h4l2.5-6 5 12 2.5-6h4"/></svg>
    </button>
    <button class="rb" data-open="tasks" aria-label="Tasks" data-tip="Tasks">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="m8.5 12 2.5 2.5 4.5-5"/></svg>
    </button>
    <button class="rb" data-open="watch" aria-label="Watching" data-tip="Watching">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="3"/></svg>
    </button>
    <button class="rb" data-open="vitals" aria-label="Vitals" data-tip="Vitals">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2.5"/><path d="M9.5 3v3M14.5 3v3M9.5 18v3M14.5 18v3M3 9.5h3M3 14.5h3M18 9.5h3M18 14.5h3"/></svg>
    </button>
    <div class="rail-map" id="rail-map">
      <span class="rail-sep"></span>
      <button class="rb" data-view="graph" aria-pressed="true" aria-label="Network view" data-tip="Network">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="7.5"/><circle cx="12" cy="12" r="2"/><circle cx="17.3" cy="6.7" r="1.4"/></svg>
      </button>
      <button class="rb" data-view="flow" aria-pressed="false" aria-label="Flow view" data-tip="Flow">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="5" r="2"/><circle cx="5" cy="19" r="2"/><circle cx="12" cy="19" r="2"/><circle cx="19" cy="19" r="2"/><path d="M12 7v10M12 11c-5 0-7 2-7 6M12 11c5 0 7 2 7 6"/></svg>
      </button>
      <button class="rb" id="btn-zoom-in" aria-label="Zoom in" data-tip="Zoom in"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6v12M6 12h12"/></svg></button>
      <button class="rb" id="btn-zoom-out" aria-label="Zoom out" data-tip="Zoom out"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h12"/></svg></button>
      <button class="rb" id="btn-fit" aria-label="Fit the map" data-tip="Fit">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V5.5A1.5 1.5 0 0 1 5.5 4H9M15 4h3.5A1.5 1.5 0 0 1 20 5.5V9M20 15v3.5a1.5 1.5 0 0 1-1.5 1.5H15M9 20H5.5A1.5 1.5 0 0 1 4 18.5V15"/><circle cx="12" cy="12" r="2.5"/></svg>
      </button>
    </div>
  </nav>

  <!-- While you were gone: plain text, right side of the ORION page -->
  <section class="summary" id="summary" aria-label="While you were gone" aria-live="polite" hidden></section>

  <!-- Business page -->
  <main class="biz" id="biz" aria-label="Ciel business" hidden></main>

  <div class="crumb" id="crumb"><span id="crumb-text">ORION overview</span></div>

  <!-- Detail panel, right -->
  <aside class="detail" id="detail" aria-label="Details" aria-live="polite">
    <div class="grab-zone" id="detail-grab"><span class="grabber"></span></div>
    <button class="tile ghost close-detail" id="btn-detail-close" aria-label="Close details">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7 7 17"/></svg>
    </button>
    <div class="detail-body" id="detail-body"></div>
  </aside>

  <!-- Conversation, floats above the dock -->
  <section class="convo glass" id="convo" aria-label="Conversation">
    <header class="convo-head">
      <a class="chat-back" id="btn-chat-back" href="#/" aria-label="Back to ORION">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 6-6 6 6 6"/></svg><span>ORION</span>
      </a>
      <h2>Conversation</h2>
      <span class="chip-sm" id="convo-steps" hidden></span>
      <button class="tile ghost sm" id="btn-convo-close" aria-label="Collapse conversation">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 10 5 5 5-5"/></svg>
      </button>
    </header>
    <button class="peek-line" id="peek-line" aria-label="Show conversation">
      <span class="bracket" aria-hidden="true"></span><span class="peek-text" id="peek-text">ORION</span>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 14 5-5 5 5"/></svg>
    </button>
    <div class="feed" id="feed">
      <div class="feed-inner" id="feed-inner"></div>
    </div>
  </section>

  <!-- The dock: live stats, ask ORION -->
  <section class="dock" id="dock" aria-label="Ask ORION">
    <div class="stats" id="stats" role="list"></div>

    <div class="composer" id="composer">
      <form class="ask" id="compose-form" autocomplete="off">
        <label class="ask-field">
          <span class="sr-only">Message ORION</span>
          <textarea id="input" rows="2" placeholder="Ask ORION" enterkeyhint="send"></textarea>
        </label>
      </form>

      <div class="voice-bar" id="voice-bar" hidden>
        <canvas class="wave" id="wave" aria-hidden="true"></canvas>
        <div class="voice-text">
          <span class="voice-state" id="voice-state">Listening</span>
          <span class="voice-transcript" id="voice-transcript">Go ahead, I’m listening.</span>
        </div>
      </div>

      <div class="dock-row">
        <button type="button" class="round-btn" id="btn-plus" aria-label="New task">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        </button>
        <span class="spacer"></span>
        <button type="button" class="round-btn voice-btn" id="btn-voice" aria-label="Start hands-free voice">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h1.5M8 8.5v7M12 5v14M16 8.5v7M19.5 12H20"/></svg>
        </button>
        <button type="button" class="round-btn end" id="btn-voice-end" aria-label="End voice" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7 7 17"/></svg>
        </button>
        <button type="submit" form="compose-form" class="send" id="btn-send" aria-label="Send" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg>
        </button>
      </div>
    </div>
  </section>

  <!-- Approvals, drop from the bell -->
  <div class="pop-catcher" id="pop-catcher"></div>
  <section class="approvals-pop glass" id="approvals-pop" role="dialog" aria-labelledby="pop-title" aria-hidden="true">
    <header class="pop-head">
      <h2 id="pop-title">Approvals</h2>
      <span class="pop-count" id="pop-count"></span>
    </header>
    <div class="pop-body" id="pop-body"></div>
  </section>

  <!-- Dashboards drawer, from the menu (left) -->
  <div class="scrim" id="scrim"></div>
  <section class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title" aria-hidden="true">
    <header class="drawer-head">
      <h2 id="drawer-title">Activity</h2>
      <button class="tile ghost" id="btn-drawer-close" aria-label="Close dashboards">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7 7 17"/></svg>
      </button>
    </header>
    <nav class="drawer-pages" aria-label="Pages">
      <a href="#/" data-route="home">ORION</a>
      <a href="#/chat" data-route="chat">Conversation</a>
      <a href="#/business" data-route="business" data-owner>Business</a>
    </nav>
    <div class="segmented" id="segmented" role="tablist">
      <span class="seg-thumb" id="seg-thumb"></span>
      <button role="tab" data-panel="activity" aria-selected="true">Activity</button>
      <button role="tab" data-panel="tasks">Tasks</button>
      <button role="tab" data-panel="watch">Watching</button>
      <button role="tab" data-panel="vitals">Vitals</button>
    </div>
    <div class="drawer-body" id="drawer-body">
      <div class="panel" data-panel="activity" id="panel-activity"></div>
      <div class="panel" data-panel="tasks" id="panel-tasks" hidden></div>
      <div class="panel" data-panel="watch" id="panel-watch" hidden></div>
      <div class="panel" data-panel="vitals" id="panel-vitals" hidden></div>
    </div>
  </section>

  <div class="banner-layer" id="banner-layer" aria-live="assertive"></div>
  <div class="tooltip" id="tooltip" role="tooltip" hidden></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
