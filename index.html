<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>ORION</title>
  <meta name="description" content="Talk to ORION, your always-on local AI.">
  <meta name="theme-color" content="#0B0B0C">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="ORION">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&family=Oxanium:wght@400;500&family=VT323&display=swap">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="bg" aria-hidden="true"><div class="shader" id="shader"></div></div>
  <!-- shared chart fills -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs>
      <linearGradient id="copper" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#f2c48a"/><stop offset="1" stop-color="#9a5a2e"/></linearGradient>
      <linearGradient id="copper-h" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#9a5a2e"/><stop offset="1" stop-color="#f2c48a"/></linearGradient>
    </defs>
  </svg>

  <!-- ORION himself -->
  <div class="stage" id="stage">
    <!-- ORION: the gold disc and its rings -->
    <div class="orbit" id="orbit"></div>
    <p class="m-state" id="m-state" aria-live="polite">Standing by</p>
  </div>

  <!-- Top bar -->
  <header class="topbar" id="topbar">
    <div class="tb-left">
      <button class="tile round" id="btn-menu" aria-label="Open dashboards" aria-haspopup="dialog" aria-controls="drawer">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8h14M5 12h14M5 16h9"/></svg>
      </button>
      <button class="brand" id="brand" aria-label="ORION, replay the intro"></button>
    </div>

    <div class="tb-right">
      <button class="pill-btn glass-pill" id="btn-new-task">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>New task</span>
      </button>
      <button class="tile round" id="btn-email" aria-label="Email alerts" aria-haspopup="dialog" aria-controls="em-ask" title="Email alerts">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="6" width="17" height="12.5" rx="2.5"/><path d="m4.5 7.5 7.5 6 7.5-6"/></svg>
        <span class="tdot" id="email-dot" hidden></span>
      </button>
      <button class="tile round bell" id="btn-approvals" data-owner aria-label="Approvals" aria-haspopup="dialog" aria-expanded="false" aria-controls="approvals-pop">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 9.5a5.5 5.5 0 1 1 11 0c0 4 1.3 5.5 2 6.5h-15c.7-1 2-2.5 2-6.5Z"/><path d="M10 19a2 2 0 0 0 4 0"/></svg>
        <span class="tdot" id="approval-dot" hidden></span>
      </button>
      <span class="conn" id="conn" role="status" aria-label="Connecting">
        <i class="conn-dot" aria-hidden="true"></i><span class="conn-t" id="conn-t">Connecting…</span>
      </span>
    </div>
  </header>

  <!-- Icon rail, left -->
  <nav class="rail" id="rail" aria-label="Pages and dashboards">
    <a class="rb on" href="#/" data-route="home" aria-label="ORION" data-tip="ORION">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="2.6"/><circle cx="5" cy="5" r="1.6"/><circle cx="19" cy="6" r="1.6"/><circle cx="5" cy="19" r="1.6"/><circle cx="19" cy="18" r="1.6"/><path d="M6.2 6.2 10 10M17.8 7.2 14 10.4M6.2 17.8 10 14M17.8 16.8 14 13.6"/></svg>
    </a>
    <a class="rb" href="#/chat" data-route="chat" aria-label="Conversation" data-tip="Conversation">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 6.5A2.5 2.5 0 0 1 7.5 4h9A2.5 2.5 0 0 1 19 6.5v7a2.5 2.5 0 0 1-2.5 2.5H11l-4 3.5V16h0.5"/><path d="M5 6.5V14a2 2 0 0 0 2 2"/></svg>
    </a>
    <a class="rb" href="#/business" data-route="business" data-owner aria-label="Business" data-tip="Business">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h16"/><path d="M7 16v-4M12 16V7M17 16v-6"/></svg>
    </a>
    <a class="rb" href="#/admin" data-route="admin" data-admin aria-label="Admin" data-tip="Admin">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8.5" r="3"/><path d="M3.5 19c.6-3.2 2.8-5 5.5-5s4.9 1.8 5.5 5"/><circle cx="17" cy="9.5" r="2.2"/><path d="M15.8 14.2c2.4-.4 4.3 1.1 4.7 4.3"/></svg>
    </a>
    <span class="rail-sep"></span>
    <button class="rb" data-open="tasks" aria-label="Tasks" data-tip="Tasks">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="m8.5 12 2.5 2.5 4.5-5"/></svg>
    </button>
  </nav>

  <!-- While you were gone: a small pill under the top bar that opens the brief -->
  <button type="button" class="sum-pill" id="sum-pill" aria-expanded="false" aria-controls="summary">
    <i class="sum-dot" aria-hidden="true"></i><span>While you were gone</span><time id="sum-pill-t"></time>
  </button>
  <section class="summary" id="summary" aria-label="While you were gone" aria-live="polite" hidden></section>

  <!-- Files ORION made this visit: a small card on wide screens, shown once he makes one -->
  <aside class="made-files" id="made-files" aria-label="Files ORION made" hidden></aside>

  <!-- Business page -->
  <main class="biz" id="biz" aria-label="Ciel business" hidden></main>

  <!-- Admin: every account, live (owner only) -->
  <main class="biz adm" id="adm" aria-label="Admin" hidden></main>

  <div class="crumb" id="crumb"><span id="crumb-text">ORION overview</span></div>

  <!-- Detail panel, right -->
  <aside class="detail" id="detail" aria-label="Details" aria-live="polite">
    <div class="grab-zone" id="detail-grab"><span class="grabber"></span></div>
    <button class="tile ghost close-detail" id="btn-detail-close" aria-label="Close details">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7 7 17"/></svg>
    </button>
    <div class="detail-body" id="detail-body"></div>
  </aside>

  <!-- Conversation, floats above the dock -->
  <section class="convo glass" id="convo" aria-label="Conversation">
    <header class="convo-head">
      <a class="chat-back" id="btn-chat-back" href="#/" aria-label="Back to ORION">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 6-6 6 6 6"/></svg><span>ORION</span>
      </a>
      <h2>Conversation</h2>
      <span class="chip-sm" id="convo-steps" hidden></span>
      <button class="tile ghost sm" id="btn-convo-close" aria-label="Collapse conversation">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 10 5 5 5-5"/></svg>
      </button>
    </header>
    <button class="peek-line" id="peek-line" aria-label="Show conversation">
      <span class="bracket" aria-hidden="true"></span><span class="peek-text" id="peek-text">ORION</span>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 14 5-5 5 5"/></svg>
    </button>
    <div class="feed" id="feed">
      <div class="feed-inner" id="feed-inner"></div>
    </div>
  </section>

  <!-- Asked from the ORION page: your words wait here while he thinks -->
  <button type="button" class="home-q" id="home-q" aria-label="Open the conversation" hidden></button>

  <!-- The dock: live stats, ask ORION -->
  <section class="dock" id="dock" aria-label="Ask ORION">
    <div class="stats" id="stats" role="list"></div>

    <div class="composer" id="composer">
      <div class="pics" id="pics" hidden></div>
      <input type="file" id="pic-in" accept="image/*" multiple hidden>
      <div class="ask" id="compose-form">
        <div class="ask-field">
          <div id="input" class="ask-box is-empty" contenteditable="plaintext-only" role="textbox" aria-multiline="true" aria-label="Message ORION" enterkeyhint="send" inputmode="text" autocapitalize="sentences" autocorrect="on" spellcheck="true" data-placeholder="Ask ORION"></div>
        </div>
      </div>

      <div class="voice-bar" id="voice-bar" hidden>
        <canvas class="wave" id="wave" aria-hidden="true"></canvas>
        <div class="voice-text">
          <span class="voice-state" id="voice-state">Listening</span>
          <span class="voice-transcript" id="voice-transcript">Go ahead, I’m listening.</span>
        </div>
      </div>

      <div class="dock-row">
        <button type="button" class="round-btn" id="btn-plus" aria-label="Add a picture" title="Add a picture">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        </button>
        <div class="cloud" id="cloud" hidden>
          <button type="button" class="cloud-dot" aria-label="Local or Local+"><span class="cloud-ic"><span class="l"></span><span class="r"></span></span></button>
          <div class="cloud-sw" role="radiogroup" aria-label="Local or Local+">
            <span class="cloud-thumb" aria-hidden="true"></span>
            <button type="button" role="radio" data-cloud="0" aria-checked="true">Local</button>
            <button type="button" role="radio" data-cloud="1" aria-checked="false">Local+</button>
          </div>
        </div>
        <span class="spacer"></span>
        <button type="button" class="round-btn voice-btn" id="btn-voice" aria-label="Start hands-free voice">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h1.5M8 8.5v7M12 5v14M16 8.5v7M19.5 12H20"/></svg>
        </button>
        <button type="button" class="round-btn end" id="btn-voice-end" aria-label="End voice" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7 7 17"/></svg>
        </button>
        <button type="button" class="send" id="btn-send" aria-label="Send" aria-disabled="true">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg>
        </button>
      </div>
    </div>
  </section>

  <!-- Approvals, drop from the bell -->
  <div class="pop-catcher" id="pop-catcher"></div>
  <section class="approvals-pop glass" id="approvals-pop" role="dialog" aria-labelledby="pop-title" aria-hidden="true">
    <header class="pop-head">
      <h2 id="pop-title">Approvals</h2>
      <span class="pop-count" id="pop-count"></span>
    </header>
    <div class="pop-body" id="pop-body"></div>
  </section>

  <!-- Dashboards drawer, from the menu (left) -->
  <div class="scrim" id="scrim"></div>
  <section class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title" aria-hidden="true">
    <header class="drawer-head">
      <h2 id="drawer-title"><span class="dt-phone">Menu</span><span class="dt-wide">Tasks</span></h2>
      <button class="tile ghost" id="btn-drawer-close" aria-label="Close dashboards">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7 7 17"/></svg>
      </button>
    </header>
    <nav class="drawer-pages" aria-label="Pages">
      <a href="#/" data-route="home"><i><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="2.6"/><circle cx="5" cy="5" r="1.6"/><circle cx="19" cy="6" r="1.6"/><circle cx="5" cy="19" r="1.6"/><circle cx="19" cy="18" r="1.6"/><path d="M6.2 6.2 10 10M17.8 7.2 14 10.4M6.2 17.8 10 14M17.8 16.8 14 13.6"/></svg></i>ORION</a>
      <a href="#/chat" data-route="chat"><i><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 6.5A2.5 2.5 0 0 1 7.5 4h9A2.5 2.5 0 0 1 19 6.5v7a2.5 2.5 0 0 1-2.5 2.5H11l-4 3.5V16h0.5"/><path d="M5 6.5V14a2 2 0 0 0 2 2"/></svg></i>Conversation</a>
      <a href="#/business" data-route="business" data-owner><i><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h16"/><path d="M7 16v-4M12 16V7M17 16v-6"/></svg></i>Business</a>
      <a href="#/admin" data-route="admin" data-admin><i><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8.5" r="3"/><path d="M3.5 19c.6-3.2 2.8-5 5.5-5s4.9 1.8 5.5 5"/><circle cx="17" cy="9.5" r="2.2"/><path d="M15.8 14.2c2.4-.4 4.3 1.1 4.7 4.3"/></svg></i>Admin</a>
    </nav>
    <div class="drawer-sec"><h3>Tasks</h3></div>
    <div class="tk-tabs" id="tk-tabs" role="tablist" aria-label="Kinds of task">
      <span class="tk-thumb" id="tk-thumb" aria-hidden="true"></span>
      <button role="tab" data-tab="always" aria-selected="true">Always</button>
      <button role="tab" data-tab="daily" aria-selected="false">Daily</button>
      <button role="tab" data-tab="scheduled" aria-selected="false">Scheduled</button>
    </div>
    <div class="drawer-body" id="drawer-body">
      <div class="panel" data-panel="tasks" id="panel-tasks"></div>
    </div>
  </section>

  <!-- Describe your task: the words go to ORION, who files the task where it belongs -->
  <div class="tk-ask em-ask" id="em-ask" role="dialog" aria-modal="true" aria-labelledby="em-h" hidden>
    <form class="tk-ask-card" id="em-form" autocomplete="on" novalidate>
      <h2 id="em-h">Get ORION’s alerts by email</h2>
      <p class="em-p" id="em-p"></p>
      <input class="em-in" id="em-in" type="email" inputmode="email" autocomplete="email" maxlength="254" placeholder="you@example.com" aria-describedby="em-p em-msg">
      <input class="em-in em-code" id="em-code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="6-digit code" aria-describedby="em-p em-msg" hidden>
      <p class="em-msg" id="em-msg" role="status" aria-live="polite"></p>
      <div class="tk-ask-foot">
        <button type="button" class="em-link" id="em-side" hidden></button>
        <span class="spacer"></span>
        <button type="button" class="btn secondary" id="em-cancel">Not now</button>
        <button type="submit" class="btn primary" id="em-go">Send code</button>
      </div>
    </form>
  </div>

  <div class="tk-ask" id="tk-ask" role="dialog" aria-modal="true" aria-labelledby="tk-ask-h" aria-describedby="tk-ask-sub" hidden>
    <form class="tk-ask-card tk-sheet" id="tk-ask-form" autocomplete="off">
      <span class="tk-grab" aria-hidden="true"></span>
      <div class="tk-sheet-head">
        <span class="tk-sheet-ic" id="tk-ask-ic" aria-hidden="true"></span>
        <div class="tk-sheet-tt"><h2 id="tk-ask-h">New task</h2><p id="tk-ask-sub"></p></div>
        <button type="button" class="tk-sheet-x" data-ask-cancel aria-label="Close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7 7 17"/></svg></button>
      </div>
      <div class="tk-field">
        <textarea id="tk-ask-in" rows="3" maxlength="600" placeholder="What should ORION do?" enterkeyhint="send" aria-labelledby="tk-ask-h"></textarea>
        <button type="submit" class="tk-go" id="tk-go" aria-label="Send to ORION" aria-disabled="true">
          <svg class="up" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg>
          <svg class="ok" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
        </button>
      </div>
      <p class="tk-ask-hint" id="tk-ask-hint" role="status" aria-live="polite" hidden></p>
    </form>
  </div>

  <div class="banner-layer" id="banner-layer" aria-live="assertive"></div>
  <div class="tooltip" id="tooltip" role="tooltip" hidden></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
